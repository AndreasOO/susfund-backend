apiVersion: apps/v1
kind: Deployment
metadata:
  name: susfund-fe-deployment
  labels:
    app: susfund-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: susfund-frontend
  template:
    metadata:
      labels:
        app: susfund-frontend
    spec:
      containers:
        - name: susfund-fe
          image: susfund-fe:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 4200
---
apiVersion: v1
kind: Service
metadata:
  name: susfund-fe-service
spec:
  type: NodePort
  selector:
    app: susfund-frontend
  ports:
    - protocol: TCP
      port: 4200
      targetPort: 4200
      nodePort: 30200
apiVersion: apps/v1
kind: Deployment
metadata:
  name: susfund-backend-deployment
  labels:
    app: susfund-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: susfund-backend
  template:
    metadata:
      labels:
        app: susfund-backend
    spec:
      containers:
        - name: susfund-be
          image: susfund-be:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 9990
          envFrom:
            - configMapRef:
                name: susfund-db-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: susfund-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: susfund-db-credentials
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: susfund-backend-service
spec:
  type: NodePort
  selector:
    app: susfund-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30800
    - name: management
      protocol: TCP
      port: 9990
      targetPort: 9990
      nodePort: 30100
services:
  susfund-fe:
    container_name: susfund-fe
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "4200:80"
    environment:
      - BE_HOST=localhost
      - BE_PORT=8080
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    networks:
      - susfund

  db:
    container_name: susfund-db
    build:
      context: .
      dockerfile: Dockerfile.db
    ports:
      - "7777:3306"
    networks:
      - susfund
    environment:
      - MYSQL_ROOT_PASSWORD=test1234
      - MYSQL_DATABASE=susfund_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptest1234" ]
      interval: 5s
      timeout: 5s
      retries: 100

  wildfly:
    container_name: susfund-wildfly
    build:
      context: .
      dockerfile: Dockerfile.wildfly
    ports:
      - "8080:8080"
      - "9990:9990"
    networks:
      - susfund
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=susfund_db
      - DB_USERNAME=root
      - DB_PASSWORD=test1234
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      - JAVA_OPTS=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
      - JAVA_OPTS=-Dresteasy.preferJacksonOverJsonB=false
    depends_on:
      db:
        condition: service_healthy

networks:
  susfund:
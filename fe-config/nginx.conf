server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    add_header Content-Type "text/html; charset=UTF-8" always;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}
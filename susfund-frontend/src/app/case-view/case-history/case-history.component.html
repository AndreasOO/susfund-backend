<!--<div class="container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1">-->
<div class="container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1">
  <h2 class="p-2">History</h2>
  <hr>
  <table class="table">
    <thead>
    <tr>
      <th scope="col">Date</th>
      <th scope="col">Details</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let historyEvent of historyEventList || []">
      <td class="col-2">{{historyEvent.date}}</td>
      <td class="col-10">{{historyEvent.details}}</td>
    </tr>
    </tbody>
  </table>
</div>

<!--container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1-->

<div class="container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1">

  <h2 class="p-2">Decision</h2>

  <hr>

  <p *ngIf="errorMessage" class="alert alert-danger mt-3 mb-3" role="alert">{{errorMessage}}</p>
  <p *ngIf="successMessage" class="alert alert-success mt-3 mb-3" role="alert">{{successMessage}}</p>

  <select class="form-select" aria-label="case manager select" [(ngModel)]="selectedDecisionResultId">
    <option *ngFor="let decisionResult of decisionOptions" [value]="decisionResult.id">{{decisionResult.name}}</option>
  </select>

  <hr>

  <h5>Motivation</h5>
  <textarea class="form-control" rows="3" [(ngModel)]="currentJustification"></textarea>

  <hr>

  <h5 class="pb-3">Case Controller </h5>

  <select class="form-select" aria-label="case manager select" [(ngModel)]="selectedCaseControllerId">
    <option *ngFor="let casemanager of caseManagerList" [value]="casemanager.id">{{casemanager.name}}</option>
  </select>

  <button class="btn btn btn-secondary col-1 mt-2" (click)="saveCaseDecision()">Save</button>

</div>

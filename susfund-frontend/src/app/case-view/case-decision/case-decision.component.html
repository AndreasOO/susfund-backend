<div class="container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1">
  <h2 class="p-2">Decision</h2>
  <hr>

  <div *ngIf="decisionFields">
    <div *ngFor="let field of decisionFields">

      <select class="form-select" aria-label="decision result select" [(ngModel)]="field.decisionResultType">
        <option *ngFor="let option of field.owningFieldDefinition.selectableValues" [value]="option.value">{{ option.value }}</option>
      </select>

      <h5>Motivation</h5>
      <div>
        <textarea class="form-control" rows="3" [value]="field.motivation"></textarea>
      </div>


      <h5 class="pb-3">Case Controller </h5>
      <div>
        <select class="form-select" aria-label="case manager select" [(ngModel)]="field.decisionController.id">
          <option *ngFor="let casemanager of caseManagerList" [value]="casemanager.id">{{casemanager.name}}</option>
        </select>
      </div>


      <div *ngIf="fieldStatus[field.id]"
           class="alert my-2"
           [ngClass]="fieldStatus[field.id]?.success ? 'alert-success' : 'alert-danger'">
        {{ fieldStatus[field.id]?.message }}
      </div>

      <button class="btn btn btn-secondary col-1 mt-2" (click)="save(field)" >Save</button>

    </div>
  </div>
  <hr>

</div>

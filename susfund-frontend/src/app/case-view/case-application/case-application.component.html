<div class="container bg-dark-subtle text-dark mt-5 mb-5 pb-2 rounded-1">
  <h2 class="mb-3 p-2">Application</h2>
  <hr>
  <div *ngIf="textFieldValues" class="container">
    <div *ngFor="let textFieldValue of textFieldValues" class="row mb-4 pb-4 border-bottom">
      <h3>{{ textFieldValue.owningFieldDefinition.subSection}}</h3>
      <div class="col-12">
        <div>
          <div class="card rounded-4 p-3 bg-secondary-subtle text-dark m-2">
            <h4>{{ textFieldValue.owningFieldDefinition.title }}</h4>
            <h5>{{ textFieldValue.owningFieldDefinition.preamble }}</h5>
            <h6>{{ textFieldValue.owningFieldDefinition.assistingText }}</h6>

            <textarea class="form-control" rows="3"
                      [(ngModel)]="textFieldValue.stringValue"></textarea>

            <div *ngIf="fieldStatus[textFieldValue.id]"
                 class="alert my-2"
                 [ngClass]="fieldStatus[textFieldValue.id]?.success ? 'alert-success' : 'alert-danger'">
              {{ fieldStatus[textFieldValue.id]?.message }}
            </div>

            <a class="btn btn-secondary m-2 col-2 ms-auto" (click)="save(textFieldValue)">Save</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
